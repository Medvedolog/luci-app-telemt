name: Validate LuCI Telemt 3.5 WEB branch

on:
  push:
    branches:
      - telemt-3.5.6-web
  workflow_dispatch:

jobs:
  validate:
    name: LuCI syntax and package ownership
    runs-on: ubuntu-latest

    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y lua5.1 jq

      - name: Validate Lua 5.1 syntax
        run: |
          set -euxo pipefail
          luac5.1 -p usr/lib/lua/luci/controller/telemt.lua
          luac5.1 -p usr/lib/lua/luci/model/cbi/telemt.lua
          luac5.1 -p usr/lib/lua/luci/model/cbi/telemt_web.lua

      - name: Validate LuCI JSON
        run: |
          set -euxo pipefail
          jq -e . usr/share/luci/menu.d/luci-app-telemt.json >/dev/null
          jq -e . usr/share/rpcd/acl.d/luci-app-telemt.json >/dev/null
          jq -e 'has("admin/services/telemt/web")' usr/share/luci/menu.d/luci-app-telemt.json >/dev/null

      - name: Assert shared UCI ownership and WEB payload
        run: |
          set -euxo pipefail

          WEB_MODEL=usr/lib/lua/luci/model/cbi/telemt_web.lua
          CONTROLLER=usr/lib/lua/luci/controller/telemt.lua

          test -s "$WEB_MODEL"
          grep -q 'cbi("telemt_web")' "$CONTROLLER"
          grep -q '"path": "telemt_web"' usr/share/luci/menu.d/luci-app-telemt.json

          # Fixed helper endpoints only; LuCI must never execute an arbitrary command.
          grep -q 'call("web_frontend_action")' "$CONTROLLER"
          grep -q 'act ~= "check" and act ~= "apply" and act ~= "restore"' "$CONTROLLER"
          grep -q 'haproxy = "/usr/libexec/telemt-web-frontend"' "$CONTROLLER"
          grep -q 'nginx = "/usr/libexec/telemt-web-nginx"' "$CONTROLLER"
          grep -q 'call("web_qr")' "$CONTROLLER"
          grep -q 'tg://webproxy?server=' "$CONTROLLER"
          grep -q 'tg://webproxy?server=' "$WEB_MODEL"
          grep -q 'X-Requested-With' "$WEB_MODEL"
          grep -q 'HTTP_X_REQUESTED_WITH' "$CONTROLLER"

          # The WEB page exposes the three mutually exclusive frontend modes.
          grep -q 'frontend:value("external"' "$WEB_MODEL"
          grep -q 'frontend:value("haproxy"' "$WEB_MODEL"
          grep -q 'frontend:value("nginx"' "$WEB_MODEL"
          grep -q '"nginx_managed"' "$WEB_MODEL"
          grep -q '"nginx_bind"' "$WEB_MODEL"
          grep -q '"nginx_cert"' "$WEB_MODEL"
          grep -q '"nginx_key"' "$WEB_MODEL"
          grep -q '"nginx_auto_fw"' "$WEB_MODEL"
          grep -q 'saved_frontend' "$WEB_MODEL"
          grep -q '/usr/libexec/telemt-web-nginx' "$WEB_MODEL"

          # WEB profiles reference shared config user; no WEB-specific secret option.
          grep -q 'pr:option(ListValue, "user"' "$WEB_MODEL"
          if grep -qE 'option\([^,]+,[[:space:]]*"(web_)?secret"' "$WEB_MODEL"; then
            echo 'ERROR: WEB page must not store a duplicate secret' >&2
            exit 1
          fi

          # Core telemt is the sole package owner of /etc/config/telemt.
          if grep -qE 'dst:[[:space:]]*/etc/config/telemt' nfpm.yaml; then
            echo 'ERROR: luci-app-telemt must not package /etc/config/telemt' >&2
            exit 1
          fi

          # nFPM payload is the whole usr tree, therefore telemt_web.lua is included
          # without adding a second package-content declaration.
          grep -qE 'src:[[:space:]]*\./usr' nfpm.yaml
          grep -qE 'dst:[[:space:]]*/usr' nfpm.yaml
