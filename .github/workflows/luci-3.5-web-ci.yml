name: Validate LuCI Telemt 3.5 WEB branch

on:
  push:
    branches:
      - telemt-3.5.6-web
  workflow_dispatch:

jobs:
  validate:
    name: LuCI syntax and package ownership
    runs-on: ubuntu-latest

    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y lua5.1 jq

      - name: Validate Lua 5.1 syntax
        run: |
          set -euxo pipefail
          luac5.1 -p usr/lib/lua/luci/controller/telemt.lua
          luac5.1 -p usr/lib/lua/luci/model/cbi/telemt.lua
          luac5.1 -p usr/lib/lua/luci/model/cbi/telemt_legacy.lua
          luac5.1 -p usr/lib/lua/luci/model/cbi/telemt_users_web.lua
          luac5.1 -p usr/lib/lua/luci/model/cbi/telemt_web.lua

      - name: Validate LuCI JSON
        run: |
          set -euxo pipefail
          jq -e . usr/share/luci/menu.d/luci-app-telemt.json >/dev/null
          jq -e . usr/share/rpcd/acl.d/luci-app-telemt.json >/dev/null
          jq -e 'has("admin/services/telemt")' usr/share/luci/menu.d/luci-app-telemt.json >/dev/null
          jq -e 'has("admin/services/telemt/web") | not' usr/share/luci/menu.d/luci-app-telemt.json >/dev/null

      - name: Assert shared UCI ownership and WEB payload
        run: |
          set -euxo pipefail

          WEB_MODEL=usr/lib/lua/luci/model/cbi/telemt_web.lua
          USERS_WRAPPER=usr/lib/lua/luci/model/cbi/telemt.lua
          USERS_LEGACY=usr/lib/lua/luci/model/cbi/telemt_legacy.lua
          USERS_WEB=usr/lib/lua/luci/model/cbi/telemt_users_web.lua
          CONTROLLER=usr/lib/lua/luci/controller/telemt.lua

          test -s "$WEB_MODEL"
          test -s "$USERS_WRAPPER"
          test -s "$USERS_LEGACY"
          test -s "$USERS_WEB"
          grep -q 'cbi("telemt_web")' "$CONTROLLER"
          grep -q '"path": "telemt_web"' usr/share/luci/menu.d/luci-app-telemt.json

          # Fixed helper endpoints only; LuCI must never execute an arbitrary command.
          grep -q 'call("web_frontend_action")' "$CONTROLLER"
          grep -q 'act ~= "check" and act ~= "apply" and act ~= "restore"' "$CONTROLLER"
          grep -q 'haproxy = "/usr/libexec/telemt-web-frontend"' "$CONTROLLER"
          grep -q 'nginx = "/usr/libexec/telemt-web-nginx"' "$CONTROLLER"
          grep -q 'call("web_qr")' "$CONTROLLER"
          grep -q 'tg://webproxy?server=' "$CONTROLLER"
          grep -q 'tg://webproxy?server=' "$WEB_MODEL"
          grep -q 'X-Requested-With' "$WEB_MODEL"
          grep -q 'HTTP_X_REQUESTED_WITH' "$CONTROLLER"

          # LAB-5A/5B: all four exact carrier values remain available, with
          # fixed as default and explicit auto-negotiation controls.
          grep -q 'carrier_policy = web:option(ListValue, "carrier_policy"' "$WEB_MODEL"
          grep -q 'carrier_policy:value("fixed"' "$WEB_MODEL"
          grep -q 'carrier_policy:value("auto"' "$WEB_MODEL"
          grep -q 'carrier_policy.default = "fixed"' "$WEB_MODEL"
          grep -q 'carrier:value("https", "HTTPS")' "$WEB_MODEL"
          grep -q 'carrier:value("https-lanes", "HTTPS lanes")' "$WEB_MODEL"
          grep -q 'carrier:value("websocket", "WebSocket")' "$WEB_MODEL"
          grep -q 'carrier:value("websocket-lanes", "WebSocket lanes")' "$WEB_MODEL"
          grep -q 'carrier.default = "https"' "$WEB_MODEL"
          grep -q 'carrier_candidates = web:option(DynamicList, "carrier_candidate"' "$WEB_MODEL"
          grep -q 'carrier_candidates:depends("carrier_policy", "auto")' "$WEB_MODEL"
          grep -q 'carrier_candidates.default = { "websocket-lanes", "websocket", "https-lanes" }' "$WEB_MODEL"
          grep -q 'Duplicate WEB carrier candidate' "$WEB_MODEL"
          grep -q 'carrier_learning = web:option(Flag, "carrier_learning"' "$WEB_MODEL"
          grep -q 'carrier_learning.default = carrier_learning.enabled' "$WEB_MODEL"
          grep -q 'carrier_aggr = web:option(ListValue, "carrier_negotiation_aggressiveness"' "$WEB_MODEL"
          grep -q 'carrier_aggr:value("conservative"' "$WEB_MODEL"
          grep -q 'carrier_aggr:value("balanced"' "$WEB_MODEL"
          grep -q 'carrier_aggr:value("aggressive"' "$WEB_MODEL"
          grep -q 'carrier_aggr.default = "conservative"' "$WEB_MODEL"

          # Users integration: CBI fragments must execute in the same injected
          # CBI environment. require() loses Map/Value under ucodebridge on 24.10.
          grep -q 'local function load_cbi_fragment' "$USERS_WRAPPER"
          grep -q 'telemt_legacy.lua' "$USERS_WRAPPER"
          grep -q 'telemt_memory_budget.lua' "$USERS_WRAPPER"
          grep -q 'telemt_users_web.lua' "$USERS_WRAPPER"
          grep -q 'setfenv(chunk, cbi_env)' "$USERS_WRAPPER"
          grep -q 'return web_users.attach(legacy)' "$USERS_WRAPPER"
          if grep -q 'require "luci.model.cbi.telemt_legacy"' "$USERS_WRAPPER"; then
            echo 'ERROR: legacy CBI must not be loaded with require() under ucodebridge' >&2
            exit 1
          fi
          grep -q 'uci:foreach("telemt", "web_profile"' "$USERS_WEB"
          grep -q 'tg://webproxy?server=' "$USERS_WEB"
          grep -q 'WEB: ' "$USERS_WEB"
          grep -q 'Copy WEB' "$USERS_WEB"
          grep -q 'web_qr' "$USERS_WEB"
          grep -q 'self.map.uci:delete("telemt", sid)' "$USERS_WEB"
          grep -q 'Delete the user and all of these WEB bindings' "$USERS_WEB"
          if grep -qE 'set\("telemt".*(web_)?secret|option\([^,]+,[[:space:]]*"(web_)?secret"' "$USERS_WEB"; then
            echo 'ERROR: Users WEB integration must not create a second secret store' >&2
            exit 1
          fi

          # The WEB page exposes the three mutually exclusive frontend modes.
          grep -q 'frontend:value("external"' "$WEB_MODEL"
          grep -q 'frontend:value("haproxy"' "$WEB_MODEL"
          grep -q 'frontend:value("nginx"' "$WEB_MODEL"
          grep -q '"nginx_managed"' "$WEB_MODEL"
          grep -q '"nginx_bind"' "$WEB_MODEL"
          grep -q '"nginx_cert"' "$WEB_MODEL"
          grep -q '"nginx_key"' "$WEB_MODEL"
          grep -q '"nginx_auto_fw"' "$WEB_MODEL"
          grep -q 'saved_frontend' "$WEB_MODEL"
          grep -q '/usr/libexec/telemt-web-nginx' "$WEB_MODEL"

          # WEB profiles reference shared config user; no WEB-specific secret option.
          grep -q 'pr:option(ListValue, "user"' "$WEB_MODEL"
          if grep -qE 'option\([^,]+,[[:space:]]*"(web_)?secret"' "$WEB_MODEL"; then
            echo 'ERROR: WEB page must not store a duplicate secret' >&2
            exit 1
          fi

          # Dev packaging is owfeed-only for both 24.10/IPK and 25.12/APKv3.
          PKG_WF=.github/workflows/luci-web-test-package-ci.yml
          grep -q 'format: ipk' "$PKG_WF"
          grep -q 'format: apk' "$PKG_WF"
          grep -q 'owfeed build --release 24.10' "$PKG_WF"
          grep -q 'owfeed build --release 25.12' "$PKG_WF"
          grep -q 'arch: noarch' "$PKG_WF"
