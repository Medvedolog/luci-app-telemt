name: Build LuCI WEB test packages

on:
  push:
    branches:
      - telemt-3.5.6-web
  workflow_dispatch:

jobs:
  package:
    name: Build test IPK and APKv3 with owfeed
    runs-on: ubuntu-latest

    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4

      - name: Install package inspection tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y binutils file

      - name: Setup verified owfeed
        uses: owfeed/owfeed/setup@v0.5.1
        with:
          version: v0.5.1

      - name: Stage LuCI payload and dual-format manifest
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .ci-owfeed dist-ipk dist-apk test-packages
          mkdir -p .ci-owfeed/root test-packages/ipk test-packages/apk
          cp -a usr .ci-owfeed/root/usr

          cat > owfeed.yml <<'EOF'
          version: 1
          feed:
            name: luci-app-telemt-ci
            url: https://example.invalid/luci-app-telemt-ci
            title: LuCI Telemt CI
            maintainer: "Medvedolog <noreply@example.invalid>"
          publish:
            - target: github-pages
          releases:
            - line: "25.12"
              format: apk
              default: true
              arches: [aarch64_generic, aarch64_cortex-a53, x86_64]
            - line: "24.10"
              format: ipk
              arches: [aarch64_generic, aarch64_cortex-a53, x86_64]
          packages:
            - name: luci-app-telemt
              build: mkpkg
              arch: noarch
              version: 3.5.7-r1
              files: ./.ci-owfeed/root
              description: "LuCI WebUI for Telemt 3.5.7 WEB alpha test package"
              url: https://github.com/Medvedolog/luci-app-telemt
              depends: [libc, luci-base, luci-compat, qrencode, ca-bundle]
              scripts:
                post-install: ./scripts/postinst
                pre-deinstall: ./scripts/prerm
                post-deinstall: ./scripts/postrm
          EOF

      - name: Resolve and inspect owfeed plan
        shell: bash
        run: |
          set -euxo pipefail
          owfeed lock --update
          owfeed plan --release 24.10
          owfeed plan --release 25.12

      - name: Build OpenWrt 24.10 IPK with owfeed
        shell: bash
        run: |
          set -euxo pipefail
          owfeed build --release 24.10 -o dist-ipk

          test "$(find dist-ipk -type f -name '*.ipk' | wc -l)" -eq 1
          ipk="$(find dist-ipk -type f -name 'luci-app-telemt*.ipk' | head -n1)"
          test -n "$ipk"
          test -s "$ipk"
          test "$(od -An -tx1 -N8 "$ipk" | tr -d ' \n')" = 213c617263683e0a

          rm -rf .ci-ipk
          mkdir -p .ci-ipk
          ar t "$ipk" > .ci-ipk/ar-members.txt
          grep -q '^debian-binary$' .ci-ipk/ar-members.txt
          ar p "$ipk" control.tar.gz > .ci-ipk/control.tar.gz
          ar p "$ipk" data.tar.gz > .ci-ipk/data.tar.gz
          tar -xOzf .ci-ipk/control.tar.gz ./control > .ci-ipk/control.txt
          tar -tzf .ci-ipk/data.tar.gz > .ci-ipk/files.txt

          grep -q '^Package: luci-app-telemt$' .ci-ipk/control.txt
          grep -q '^Architecture: all$' .ci-ipk/control.txt
          grep -Eq '(^|\./)usr/lib/lua/luci/model/cbi/telemt.lua$' .ci-ipk/files.txt
          grep -Eq '(^|\./)usr/lib/lua/luci/model/cbi/telemt_legacy.lua$' .ci-ipk/files.txt
          grep -Eq '(^|\./)usr/lib/lua/luci/model/cbi/telemt_memory_budget.lua$' .ci-ipk/files.txt
          grep -Eq '(^|\./)usr/lib/lua/luci/model/cbi/telemt_web.lua$' .ci-ipk/files.txt
          if grep -Eq '(^|\./)etc/config/telemt$' .ci-ipk/files.txt; then
            echo 'ERROR: LuCI IPK must not own /etc/config/telemt' >&2
            exit 1
          fi

          cp "$ipk" test-packages/ipk/

      - name: Build OpenWrt 25.12 APKv3 with owfeed
        shell: bash
        run: |
          set -euxo pipefail
          owfeed build --release 25.12 -o dist-apk

          test "$(find dist-apk -type f -name '*.apk' | wc -l)" -eq 1
          apk="$(find dist-apk -type f -name 'luci-app-telemt*.apk' | head -n1)"
          test -n "$apk"
          test -s "$apk"
          test "$(od -An -tx1 -N3 "$apk" | tr -d ' \n')" = 414442
          cp "$apk" test-packages/apk/

      - name: Verify dual-format package matrix
        shell: bash
        run: |
          set -euxo pipefail
          test "$(find test-packages/ipk -type f -name '*.ipk' | wc -l)" -eq 1
          test "$(find test-packages/apk -type f -name '*.apk' | wc -l)" -eq 1
          if grep -R -n 'nfpm' .github/workflows/luci-web-test-package-ci.yml; then
            echo 'ERROR: nFPM remains in LuCI dev packaging workflow' >&2
            exit 1
          fi
          cp owfeed.lock test-packages/
          find test-packages -maxdepth 3 -type f -print | sort

      - name: Upload complete LuCI test package set
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-telemt-web-test-packages
          path: |
            test-packages/
            .ci-ipk/control.txt
            .ci-ipk/files.txt
          if-no-files-found: error
          retention-days: 14
