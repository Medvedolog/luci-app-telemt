name: CI

on:
  push:
    branches: [main, telemt-3.5.6-web]
    tags: ['[0-9]*', 'v[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sources:
    name: Sources parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Lua 5.1 and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 jq
      - run: sh tools/check-sources.sh
      - name: Regression checks (UCI / LuCI contracts)
        run: python3 tools/test-regressions.py

  build:
    name: Build native OpenWrt packages
    needs: sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: owfeed/owfeed/setup@v0.5.1
        with:
          version: v0.5.1

      - name: Reproducible package timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Stage LuCI package
        run: ./tools/stage.sh
      - run: owfeed plan
      - run: owfeed check
      - run: owfeed build
      - run: sh tools/check-package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: owfeed-packages
          path: dist/
          if-no-files-found: error

  verify:
    name: Install on real OpenWrt userspace
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: owfeed-packages
          path: dist/

      - uses: owfeed/owlab/setup@v0.6.5
        with:
          version: v0.6.5

      - name: OpenWrt 25.12 APKv3
        uses: owfeed/owlab/action@v0.6.5
        with:
          version: v0.6.5
          releases: "25.12.5"
          install: dist/noarch/luci-app-telemt-*.apk
          assert: |
            package luci-app-telemt
            file /usr/lib/lua/luci/controller/telemt.lua
            file /usr/lib/lua/luci/model/cbi/telemt.lua
            file /usr/lib/lua/luci/model/cbi/telemt_web.lua
            file /usr/share/luci/menu.d/luci-app-telemt.json
            file /usr/share/rpcd/acl.d/luci-app-telemt.json
            exec test ! -e /etc/config/telemt

      - name: OpenWrt 24.10 IPK
        uses: owfeed/owlab/action@v0.6.5
        with:
          version: v0.6.5
          releases: "24.10.8"
          install: dist/all/luci-app-telemt_*.ipk
          assert: |
            package luci-app-telemt
            file /usr/lib/lua/luci/controller/telemt.lua
            file /usr/lib/lua/luci/model/cbi/telemt.lua
            file /usr/lib/lua/luci/model/cbi/telemt_web.lua
            file /usr/share/luci/menu.d/luci-app-telemt.json
            file /usr/share/rpcd/acl.d/luci-app-telemt.json
            exec test ! -e /etc/config/telemt

  release-preflight:
    name: Release signing preflight
    needs: [build, verify]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify committed public signing keys
        run: |
          set -eu
          test -s keys/telemt-luci-sign.pub.pem || { echo 'missing keys/telemt-luci-sign.pub.pem; run tools/setup-keys.sh once and commit the public keys'; exit 1; }
          test -s keys/telemt-luci-release.pub || { echo 'missing keys/telemt-luci-release.pub; run tools/setup-keys.sh once and commit the public keys'; exit 1; }

  release:
    name: Sign and publish
    needs: [build, verify, release-preflight]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: owfeed/owfeed/.github/workflows/package.yml@v0.5.1
    secrets:
      sign-key: ${{ secrets.TELEMT_LUCI_SIGN_KEY }}
      usign-key: ${{ secrets.TELEMT_LUCI_USIGN_KEY }}
    with:
      owfeed-version: v0.5.1
      verify-with: keys/telemt-luci-release.pub

  # The telemt core of the same base version, attached to this release byte for byte
  # with its author's signatures. Runs after the release exists; when the core has
  # not been released yet it does nothing, so release the core first.
  bundle-core:
    name: Attach matching core packages
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: ./.github/workflows/bundle-core.yml
    with:
      tag: ${{ github.ref_name }}
